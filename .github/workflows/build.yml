name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Rust engine
        run: |
          cd apps/coomi-rs
          cargo build --release --target aarch64-linux-android

      - name: Build APK
        run: |
          echo "coomi.signing.storePassword=123456" >> local.properties
          echo "coomi.signing.keyPassword=123456" >> local.properties
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/coomi-app/app/build/outputs/apk/debug/*.apk